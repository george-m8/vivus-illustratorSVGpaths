<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Auto-loader Tests</title>
  <script src="https://cdn.jsdelivr.net/npm/vivus@0.4.4/dist/vivus.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vivus@0.4.4/src/pathformer.js"></script>
  <script src="js/vivusObserver.js"></script>
  <style>
    body { margin: 0; padding: 20px; background: #222; color: #fff; font-family: sans-serif; }
    #results { position: sticky; top: 0; background: #111; padding: 10px; z-index: 1; max-height: 40vh; overflow: auto; }
    #results li.pass { color: #7f7; }
    #results li.fail { color: #f77; }
    section { margin: 40px 0; border-top: 1px solid #555; padding-top: 10px; }
    .row { display: flex; gap: 20px; flex-wrap: wrap; }
    .row > div { width: 120px; }
    svg { width: 100%; height: auto; display: block; }
    .spacer { height: 120vh; }
  </style>
</head>
<body>
  <!--
    Self-checking test page. Open via a local server:
      uv run --no-project python dev_server.py
    then http://localhost:8000/test-auto.html
    The summary line reads "ALL PASS" or "N FAILED".
    Keep the tab visible: hidden tabs don't fire IntersectionObserver, so the
    "animates when in view" checks fail there.
  -->
  <div id="results"><strong id="summary">Running...</strong><ul id="list"></ul></div>
  <script>
    // Timeline of data-svg-state changes, for debugging timing failures
    window.stateLog = [];
    new MutationObserver(muts => muts.forEach(m => stateLog.push([Math.round(performance.now()), m.target.id, m.target.dataset.svgState])))
      .observe(document.documentElement, { subtree: true, attributeFilter: ['data-svg-state'] });
  </script>

  <section>
    <h2>T2: single placeholders</h2>
    <div class="row">
      <div id="t2play" data-svg="play"></div>
      <div id="t2path" data-svg="svgs/book.svg" data-svg-duration="10" data-svg-type="oneByOne"></div>
      <div id="t2bad" data-svg="nope"></div>
    </div>
  </section>

  <section>
    <h2>Rotation (legacy initRotationControls)</h2>
    <div class="row"><div id="rotUnit"><svg viewBox="0 0 10 10"></svg></div></div>
  </section>

  <script>
    const results = [];
    function check(name, ok, detail) {
      results.push({ name, ok: !!ok, detail });
    }
    function report() {
      const list = document.getElementById('list');
      list.innerHTML = '';
      results.forEach(r => {
        const li = document.createElement('li');
        li.className = r.ok ? 'pass' : 'fail';
        li.textContent = `${r.ok ? 'PASS' : 'FAIL'} ${r.name}${r.ok || r.detail === undefined ? '' : ' - ' + JSON.stringify(r.detail)}`;
        list.appendChild(li);
      });
      const failed = results.filter(r => !r.ok).length;
      const summary = document.getElementById('summary');
      summary.textContent = failed ? `${failed} FAILED` : 'ALL PASS';
      summary.dataset.result = failed ? 'fail' : 'pass';
    }
    const wait = ms => new Promise(r => setTimeout(r, ms));

    async function testRotation() {
      const api = initRotationControls([{ containerId: 'rotUnit' }], '[data-none]', 0, false);
      const svg = document.querySelector('#rotUnit svg');
      const seq = [];
      for (const a of [350, 10]) { api.rotateSVG('rotUnit', a); seq.push(svg.style.transform); }
      check('rotation 0 -> 350 -> 10 turns -10 then +20', seq[0] === 'rotate(-10deg)' && seq[1] === 'rotate(10deg)', seq);
      check('rotation state reports normalised angle', api.getRotationState('rotUnit').currentAngle === 10, api.getRotationState('rotUnit'));

      const seq2 = [];
      for (const a of [270, 10, 720]) { api.rotateSVG('rotUnit', a); seq2.push(svg.style.transform); }
      check('rotation 10 -> 270 -> 10 -> 720 stays on short path', seq2.join() === 'rotate(-90deg),rotate(10deg),rotate(0deg)', seq2);
    }

    async function waitForState(el, states, timeout = 4000) {
      const start = Date.now();
      while (Date.now() - start < timeout) {
        if (states.includes(el.dataset.svgState)) return true;
        await wait(50);
      }
      return false;
    }

    async function testSingle() {
      const play = document.getElementById('t2play');
      const path = document.getElementById('t2path');
      const bad = document.getElementById('t2bad');

      check('T2 name placeholder animates when in view', await waitForState(play, ['animated']), play.dataset.svgState);
      check('T2 name placeholder contains an svg', !!play.querySelector('svg'));
      check('T2 injected svg has no id', play.querySelector('svg') && !play.querySelector('svg').hasAttribute('id'));
      const req = performance.getEntriesByType('resource').map(e => e.name);
      check('T2 name resolves against script base', req.includes(`${location.origin}/svgs/play.svg`), req.filter(u => u.endsWith('.svg')));

      check('T2 path placeholder loads', await waitForState(path, ['ready', 'animated']), path.dataset.svgState);
      const inst = typeof getVivusInstance === 'function' ? getVivusInstance(path) : null;
      check('T2 duration/type attributes respected', inst && inst.duration === 10 && inst.type === 'oneByOne', inst && { d: inst.duration, t: inst.type });
      const playInst = typeof getVivusInstance === 'function' ? getVivusInstance(play) : null;
      check('T2 defaults are 36 / scenario-sync', playInst && playInst.duration === 36 && playInst.type === 'scenario-sync', playInst && { d: playInst.duration, t: playInst.type });

      check('T2 bad name sets error state', await waitForState(bad, ['error']), bad.dataset.svgState);
    }

    window.addEventListener('load', async () => {
      await testSingle();
      await testRotation();
      report();
    });
  </script>
</body>
</html>
